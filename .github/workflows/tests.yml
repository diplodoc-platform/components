# Temporary branch-only manual smoke. Never merge or distribute this workflow.
name: Components premerge caller smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.decision.outputs.profile }}
      run-deep: ${{ steps.decision.outputs.run-deep }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 76675efbf7b427f40ac0a682bf5b68e07c991a67
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
      - uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/infra
          ref: f68e71c082c45e30c58a29c5a2c7d031f632b1ef
          path: trusted-infra
          persist-credentials: false
      - name: Install trusted policy without candidate lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: trusted-infra
      - name: Extract the real locked update from immutable commits
        run: |
          mkdir -p artifacts
          git show 5d3fe97cf3927a0e5454c1e0884c5f5b06f44058:package.json > artifacts/before-pkg.json
          git show 5d3fe97cf3927a0e5454c1e0884c5f5b06f44058:package-lock.json > artifacts/before-lock.json
          git show 76675efbf7b427f40ac0a682bf5b68e07c991a67:package.json > artifacts/after-pkg.json
          git show 76675efbf7b427f40ac0a682bf5b68e07c991a67:package-lock.json > artifacts/after-lock.json
      - name: Run the real classifier on the actual Dependabot diff
        run: |
          node trusted-infra/scripts/dependency-policy-review.js --registry trusted-infra/dependency-policy.yml --before-pkg artifacts/before-pkg.json --after-pkg artifacts/after-pkg.json --before-lock artifacts/before-lock.json --after-lock artifacts/after-lock.json --repo components --head-sha 76675efbf7b427f40ac0a682bf5b68e07c991a67 --comment artifacts/assessment.md --json artifacts/assessment.json --quiet
      - name: Export the trusted decision
        id: decision
        env:
          EXPECTED_SHA: 76675efbf7b427f40ac0a682bf5b68e07c991a67
        run: node trusted-infra/scripts/dependency-verification-decision.js artifacts/assessment.json
      - name: Require rendering selection and describe the proof boundary
        env:
          PROFILE: ${{ steps.decision.outputs.profile }}
          RUN_DEEP: ${{ steps.decision.outputs.run-deep }}
        run: |
          test "$PROFILE" = document-rendering
          test "$RUN_DEEP" = true
          echo 'Manual external workflow_call smoke only. This is not a natural Dependabot pull_request authorization check.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premerge-classifier-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
  graph:
    needs: classify
    if: needs.classify.outputs.profile == 'document-rendering' && needs.classify.outputs.run-deep == 'true'
    uses: diplodoc-platform/testpack/.github/workflows/components-premerge-graph.yml@5f955c0da84a9672fc11257e0a2c83ef3a9b21f6
    with:
      metapackage-sha: 3446348576fe5d5bba8fc26ad80c03f1c7e750d6
      components-sha: 76675efbf7b427f40ac0a682bf5b68e07c991a67
